[project]
name = "finance-expense-backend"
version = "1.0.0"
description = "FastAPI backend for expense reimbursement automation"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1,<5",
    "fastapi>=0.115,<1",
    "motor>=3.6,<4",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

